<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGroup</title>
    <script type="module" src="chatbox.js">
    </script>
    <!--
    Prompt:
    ChatBox.
    1.Build a chatbox Element
    -->
    <style>
        @font-face {
            font-family: ChildHood;
            src: url(ChildHood.otf);
        }
        @font-face {
            font-family: H;
            src: url(Helvetica.ttf);
        }
        body{
            background-color:white;
            
        }
        .chatbox{
            width:90vw;
            background-color: transparent;
            border: none;
            display: flex;
            flex-direction: column;
            margin-left:50%;
            font-size:50px;
            transform:translateX(-50%);
            margin-bottom:16vh;
         
    
        }
        .chat{
            font-family: Arial, Helvetica, sans-serif;
            margin:4px;
            padding:3px 3px;
            font-family: H;
            text-shadow:2px 2px 2px rgba(0, 0, 0, 0.35)
        }
        .msgBarDiv{
            position:fixed;
            box-shadow:0 -5px 5px rgba(0, 0, 0, 0.35);  
            z-index:3;
            bottom:0%;
            padding:1%;
            right:0;
            left:0;
            font-family: Arial, Helvetica, sans-serif;
            font-size:20px;
            display:flex;
            align-items: center;
            justify-content: center;
            background-color:white;
            
        }
        .msgBar,.enter,.nameBar{
             
              font-size:30px;
        }
        .msgBar,.nameBar{
            border:none;
            height:45px;
        }
        .msgBar{
            
        }
        .nameBar{
            text-align:right;
            border-right:3px solid black;
        }
        .enter{
           
            background-color:rgb(0, 0, 0);
            border:none;
            cursor:pointer;
            transition:all ease .3s;
            font-size:25px;
            color:rgb(255, 255, 255);
            border-radius:5px;
            padding:5px;
            padding-bottom:10px;
            padding-top:10px;
            padding-right:10px;padding-left:10px;
            font-family: H;
        }
        .enter:hover{
            background-color:rgb(89, 89, 89);
        }
        .Dive{
            border:none;
            margin-right:10px;
        }
        

    </style>
</head>
<body>
    <div class="msgBarDiv">
        <div class="Dive"><input type="text" class="nameBar" placeholder="Name!">
        <input type="text" class="msgBar" placeholder="Type in your Message!"><!-- This is where you type your message-->
        </div>
        <button class="enter">Enter!</button><!-- To Enter Message to the database-->
    </div>
    <div class="chatboxDiv">
        <chatbox class="chatbox">
            <chat class="chat">Ello (this is a msg template)</chat>
        </chatbox>
    </div>
    
    <!--
    enter key
    stop the ticking
    
    -->
    
</body>
</html>
